<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clasificador de Funciones</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
<main>
    <h1>Clasificador de Funciones</h1>

    <p class="coef">b = <span id="valorB">?</span></p>
    <p class="coef">c = <span id="valorC">?</span></p>
    <p id="funcion">f(x) = ?</p>

    <button id="btnGenerar">Generar / Cambiar</button>

    <section id="cajaLineal" class="caja">
        <h2>LINEAL</h2>
        <ul id="propLineal"></ul>
    </section>

    <section id="cajaAfin" class="caja">
        <h2>AFÍN</h2>
        <ul id="propAfin"></ul>
    </section>

    <p>
        <a href="https://www.geogebra.org/classic" target="_blank">Abrir GeoGebra Clásico</a>
    </p>
</main>

</body>
</html>
